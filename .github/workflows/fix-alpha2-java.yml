name: Fix alpha2 Java source

on:
  push:
    branches:
      - agent/animal-health-0.9.0-alpha.2-shared-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/animal-health-0.9.0-alpha.2-shared-ui
      - name: Fix generated backend syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/ch/animalhealth/app/StandaloneBackend.java')
          text = p.read_text()
          replacements = {
              'put("animal_count",c.getInt(3))));}': 'put("animal_count",c.getInt(3)));}',
              'put("data",json(c.getString(9)))));}': 'put("data",json(c.getString(9))));}',
              'put("planned",json(c.getString(4)))));}': 'put("planned",json(c.getString(4))));}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected pattern: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/ch/animalhealth/app/StandaloneBackend.java
          git commit -m "Fix standalone backend Java syntax"
          git push origin HEAD:agent/animal-health-0.9.0-alpha.2-shared-ui
