name: Fix alpha3 version alignment

on:
  push:
    branches:
      - agent/animal-health-0.9.0-alpha.3-android-bundle

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/animal-health-0.9.0-alpha.3-android-bundle
      - name: Align frontend and smoke-test version strings
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('custom_components/animal_health/frontend/animal-health-panel.part01.js'),
              Path('tests/dashboard_frontend_smoke.py'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if '0.9.0-alpha.2' not in text:
                  raise SystemExit(f'expected old version not found in {path}')
              path.write_text(text.replace('0.9.0-alpha.2', '0.9.0-alpha.3'), encoding='utf-8')
          PY
      - name: Commit alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/animal_health/frontend/animal-health-panel.part01.js tests/dashboard_frontend_smoke.py
          git commit -m "Align frontend version with 0.9.0-alpha.3"
          git push origin HEAD:agent/animal-health-0.9.0-alpha.3-android-bundle
