name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile Python files
        run: python -m compileall custom_components tests
      - name: Validate dashboard integration
        run: python tests/dashboard_frontend_smoke.py
      - name: Validate groups, attachments and exports
        run: python tests/feature_export_smoke.py
      - name: Validate breed catalogue coverage
        run: python tests/breed_catalog_smoke.py
      - name: Validate linked task schema
        run: python tests/task_record_schema_smoke.py
      - name: Validate all-day overdue handling
        run: python tests/task_overdue_smoke.py
      - name: Validate task resolution states
        run: python tests/task_resolution_smoke.py
      - name: Validate task catalogue selectors
        run: python tests/catalog_selector_smoke.py
      - name: Validate task action resolution UX
        run: python tests/task_action_resolution_smoke.py
      - name: Validate atomic multi-animal task creation
        run: python tests/task_batch_atomicity_smoke.py
      - name: Validate task service translations
        run: python tests/test_task_service_translations.py
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              with path.open(encoding='utf-8') as file:
                  json.load(file)
              print(f'valid: {path}')
          PY
