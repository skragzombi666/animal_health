name: Align alpha4 version strings

on:
  push:
    branches:
      - agent/animal-health-0.9.0-alpha.4-stable-signing

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/animal-health-0.9.0-alpha.4-stable-signing
      - name: Align version strings
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [
              Path('custom_components/animal_health/frontend/animal-health-panel.part01.js'),
              Path('tests/dashboard_frontend_smoke.py'),
              Path('tests/test_branding_assets.py'),
              Path('tests/test_android_alpha.py'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if '0.9.0-alpha.3' not in text:
                  raise SystemExit(f'old version not found in {path}')
              path.write_text(text.replace('0.9.0-alpha.3', '0.9.0-alpha.4'), encoding='utf-8')
          PY
      - name: Commit alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/animal_health/frontend/animal-health-panel.part01.js tests/dashboard_frontend_smoke.py tests/test_branding_assets.py tests/test_android_alpha.py
          git commit -m "Align frontend and tests with 0.9.0-alpha.4"
          git push origin HEAD:agent/animal-health-0.9.0-alpha.4-stable-signing
