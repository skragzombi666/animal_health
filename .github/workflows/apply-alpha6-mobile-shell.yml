name: Apply alpha6 Android mobile shell patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/animal-health-0.9.0-alpha.6-mobile-shell
      - name: Patch Android mobile shell
        shell: python
        run: |
          from pathlib import Path
          p=Path('android/app/src/main/java/ch/animalhealth/app/MainActivity.java')
          s=p.read_text()
          old='''        target.setOnApplyWindowInsetsListener((view, insets) -> {
            int left = insets.getSystemWindowInsetLeft();
            int top = insets.getSystemWindowInsetTop();
            int right = insets.getSystemWindowInsetRight();
            int bottom = insets.getSystemWindowInsetBottom();
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                DisplayCutout cutout = insets.getDisplayCutout();
                if (cutout != null) {
                    left = Math.max(left, cutout.getSafeInsetLeft());
                    top = Math.max(top, cutout.getSafeInsetTop());
                    right = Math.max(right, cutout.getSafeInsetRight());
                    bottom = Math.max(bottom, cutout.getSafeInsetBottom());
                }
            }
'''
          new='''        target.setOnApplyWindowInsetsListener((view, insets) -> {
            int left;
            int top;
            int right;
            int bottom;
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                android.graphics.Insets bars = insets.getInsets(
                    WindowInsets.Type.statusBars() |
                    WindowInsets.Type.navigationBars() |
                    WindowInsets.Type.displayCutout()
                );
                left = bars.left;
                top = bars.top;
                right = bars.right;
                bottom = bars.bottom;
            } else {
                left = insets.getSystemWindowInsetLeft();
                top = insets.getSystemWindowInsetTop();
                right = insets.getSystemWindowInsetRight();
                bottom = insets.getSystemWindowInsetBottom();
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                    DisplayCutout cutout = insets.getDisplayCutout();
                    if (cutout != null) {
                        left = Math.max(left, cutout.getSafeInsetLeft());
                        top = Math.max(top, cutout.getSafeInsetTop());
                        right = Math.max(right, cutout.getSafeInsetRight());
                        bottom = Math.max(bottom, cutout.getSafeInsetBottom());
                    }
                }
            }
'''
          if old not in s:
              raise SystemExit('Insets block not found')
          p.write_text(s.replace(old,new))

          p=Path('custom_components/animal_health/manifest.json')
          s=p.read_text().replace('"version": "0.9.0-alpha.5"','"version": "0.9.0-alpha.6"')
          p.write_text(s)
          p=Path('custom_components/animal_health/frontend/animal-health-panel.part01.js')
          s=p.read_text().replace('const V="0.9.0-alpha.5"','const V="0.9.0-alpha.6"')
          p.write_text(s)
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('versionCode = 900005','versionCode = 900006').replace('versionName = "0.9.0-alpha.5"','versionName = "0.9.0-alpha.6"')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/ch/animalhealth/app/MainActivity.java android/app/build.gradle.kts custom_components/animal_health/manifest.json custom_components/animal_health/frontend/animal-health-panel.part01.js
          git commit -m "Fix Android 15/16 system insets for alpha6"
          git push origin HEAD:agent/animal-health-0.9.0-alpha.6-mobile-shell
