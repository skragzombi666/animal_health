name: Fix alpha2 Java types

on:
  push:
    branches:
      - agent/animal-health-0.9.0-alpha.2-shared-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/animal-health-0.9.0-alpha.2-shared-ui
      - name: Fix backend nullable strings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/ch/animalhealth/app/StandaloneBackend.java')
          text = p.read_text()
          replacements = {
              'String endText=nullable(c,4);': 'String endText=c.isNull(4)?null:c.getString(4);',
              'String time=nullable(c,5);': 'String time=c.isNull(5)?null:c.getString(5);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected pattern: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/ch/animalhealth/app/StandaloneBackend.java
          git commit -m "Fix standalone backend nullable string types"
          git push origin HEAD:agent/animal-health-0.9.0-alpha.2-shared-ui
