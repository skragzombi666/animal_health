name: Phase 4 Runtime Fixes

on:
  push:
    branches:
      - "consolidation/phase-4-readonly-animals"
    paths:
      - "scripts/phase4_apply_runtime_fixes.py"
      - ".github/workflows/phase4-fix-runtime.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "consolidation/phase-4-readonly-animals"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply targeted lifecycle fixes
        run: python scripts/phase4_apply_runtime_fixes.py
      - name: Install pinned frontend build dependency
        run: npm install --no-package-lock
      - name: Run focused runtime regressions
        run: node --test tests/frontend/read-only-runtime-regressions.test.mjs tests/frontend/legacy-read-only-bridge.test.mjs
      - name: Build active frontend bundle
        run: npm run build:frontend
      - name: Verify generated JavaScript
        run: |
          node scripts/build_frontend.mjs --check
          node --check custom_components/animal_health/frontend/dist/animal-health-panel.js
      - name: Run all modular frontend tests
        run: npm run test:frontend
      - name: Check modular frontend source
        run: npm run check:frontend
      - name: Commit verified fixes and generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/animal_health/frontend/src/app/read-only-animals.js \
            custom_components/animal_health/frontend/src/legacy/compatibility-bridge.js \
            tests/frontend/legacy-read-only-bridge.test.mjs \
            custom_components/animal_health/frontend/dist/animal-health-panel.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: complete Phase 4 runtime lifecycle"
          git push origin HEAD:"consolidation/phase-4-readonly-animals"
