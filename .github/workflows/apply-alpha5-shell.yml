name: Apply alpha5 Android shell patch

on:
  push:
    branches:
      - agent/animal-health-0.9.0-alpha.5-android-shell-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/animal-health-0.9.0-alpha.5-android-shell-fixes
      - name: Patch native shell and shared version references
        run: |
          python - <<'PY'
          from pathlib import Path

          activity = Path('android/app/src/main/java/ch/animalhealth/app/MainActivity.java')
          text = activity.read_text(encoding='utf-8')

          old = 'import android.os.Bundle;\n'
          new = 'import android.os.Build;\nimport android.os.Bundle;\nimport android.view.DisplayCutout;\nimport android.view.View;\nimport android.view.WindowInsets;\n'
          if text.count(old) != 1:
              raise SystemExit('MainActivity import anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''        getWindow().setStatusBarColor(Color.WHITE);\n        getWindow().getDecorView().setSystemUiVisibility(android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);\n'''
          new = '''        getWindow().setStatusBarColor(Color.WHITE);\n        getWindow().setNavigationBarColor(Color.WHITE);\n        getWindow().getDecorView().setSystemUiVisibility(\n            View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR\n        );\n'''
          if text.count(old) != 1:
              raise SystemExit('MainActivity system bar anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''        setContentView(webView);\n        webView.loadUrl("file:///android_asset/index.html");\n    }\n\n    @Override\n    protected void onDestroy() {\n'''
          new = '''        setContentView(webView);\n        applySystemWindowInsets(webView);\n        webView.loadUrl("file:///android_asset/index.html");\n    }\n\n    private void applySystemWindowInsets(View target) {\n        target.setOnApplyWindowInsetsListener((view, insets) -> {\n            int left = insets.getSystemWindowInsetLeft();\n            int top = insets.getSystemWindowInsetTop();\n            int right = insets.getSystemWindowInsetRight();\n            int bottom = insets.getSystemWindowInsetBottom();\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n                DisplayCutout cutout = insets.getDisplayCutout();\n                if (cutout != null) {\n                    left = Math.max(left, cutout.getSafeInsetLeft());\n                    top = Math.max(top, cutout.getSafeInsetTop());\n                    right = Math.max(right, cutout.getSafeInsetRight());\n                    bottom = Math.max(bottom, cutout.getSafeInsetBottom());\n                }\n            }\n            if (view.getPaddingLeft() != left || view.getPaddingTop() != top ||\n                view.getPaddingRight() != right || view.getPaddingBottom() != bottom) {\n                view.setPadding(left, top, right, bottom);\n            }\n            return insets;\n        });\n        target.requestApplyInsets();\n    }\n\n    @Override\n    protected void onDestroy() {\n'''
          if text.count(old) != 1:
              raise SystemExit('MainActivity content-view anchor mismatch')
          text = text.replace(old, new, 1)
          activity.write_text(text, encoding='utf-8')

          backend = Path('android/app/src/main/java/ch/animalhealth/app/StandaloneBackend.java')
          text = backend.read_text(encoding='utf-8')
          old = 'public static final String VERSION = "0.9.0-alpha.2";'
          new = 'public static final String VERSION = BuildConfig.ANIMAL_HEALTH_VERSION;'
          if text.count(old) != 1:
              raise SystemExit('StandaloneBackend version anchor mismatch')
          backend.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in [
              Path('custom_components/animal_health/frontend/animal-health-panel.part01.js'),
              Path('tests/dashboard_frontend_smoke.py'),
              Path('tests/test_branding_assets.py'),
          ]:
              text = path.read_text(encoding='utf-8')
              if '0.9.0-alpha.4' not in text:
                  raise SystemExit(f'alpha.4 version not found in {path}')
              path.write_text(text.replace('0.9.0-alpha.4', '0.9.0-alpha.5'), encoding='utf-8')
          PY
      - name: Commit shell patch
        run: |
          rm .github/workflows/apply-alpha5-shell.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Android status bars and standalone version handling"
          git push origin HEAD:agent/animal-health-0.9.0-alpha.5-android-shell-fixes
