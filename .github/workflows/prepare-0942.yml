name: Prepare 0.9.42 Release

on:
  push:
    branches:
      - "release/0.9.42"
    paths:
      - "scripts/prepare_release_0942.py"
      - "scripts/run_prepare_release_0942.py"
      - ".github/workflows/prepare-0942.yml"

permissions:
  contents: write

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "release/0.9.42"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply release metadata and test-contract changes
        run: python scripts/run_prepare_release_0942.py
      - name: Install test dependencies
        run: |
          python -m pip install pytest
          npm install --no-package-lock
      - name: Verify architecture and bundle
        run: |
          python -m compileall custom_components tests scripts
          python scripts/architecture_inventory.py --root . --check
          node scripts/build_frontend.mjs --check
          node --check custom_components/animal_health/frontend/dist/animal-health-panel.js
          npm run check:frontend
          npm run test:frontend
      - name: Run complete Python suite
        run: python -m pytest -q
      - name: Commit verified release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            custom_components/animal_health/manifest.json \
            docs/version-0.9.42.md \
            tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "release: prepare Animal Health 0.9.42"
          git push origin HEAD:"release/0.9.42"
