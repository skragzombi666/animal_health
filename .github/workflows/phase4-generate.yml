name: Phase 4 Generated Bundle

on:
  push:
    branches:
      - "consolidation/phase-4-readonly-animals"
    paths:
      - "package.json"
      - "scripts/build_frontend.mjs"
      - "custom_components/animal_health/frontend/src/**"
      - ".github/workflows/phase4-generate.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "consolidation/phase-4-readonly-animals"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned frontend build dependency
        run: npm install --no-package-lock
      - name: Build active frontend bundle
        run: npm run build:frontend
      - name: Validate generated JavaScript
        run: node --check custom_components/animal_health/frontend/dist/animal-health-panel.js
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/animal_health/frontend/dist/animal-health-panel.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh active modular frontend bundle"
          git push origin HEAD:"consolidation/phase-4-readonly-animals"
