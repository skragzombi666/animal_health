name: Android Alpha

on:
  pull_request:
    paths:
      - "android/**"
      - "custom_components/animal_health/frontend/**"
      - "custom_components/animal_health/manifest.json"
      - "docs/version-*.md"
      - "scripts/build_frontend.mjs"
      - "scripts/check_frontend_modules.mjs"
      - "tests/frontend/**"
      - "package.json"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "custom_components/animal_health/frontend/**"
      - "custom_components/animal_health/manifest.json"
      - "docs/version-*.md"
      - "scripts/build_frontend.mjs"
      - "scripts/check_frontend_modules.mjs"
      - "tests/frontend/**"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install frontend build dependency
        run: npm install --no-package-lock
      - name: Check shared modular frontend source
        run: npm run check:frontend
      - name: Test shared modular frontend contracts
        run: npm run test:frontend
      - name: Verify shared frontend bundle
        run: node scripts/build_frontend.mjs --check
      - name: Build standalone Android alpha APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animal-health-android-alpha
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
