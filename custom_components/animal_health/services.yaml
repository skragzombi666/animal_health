create_animal:
  fields:
    name:
      required: true
      example: Ada
      selector:
        text:
    species:
      required: true
      example: Chicken
      selector:
        text:
    breed:
      example: Sussex
      selector:
        text:
    color:
      example: Brown and white
      selector:
        text:
    sex:
      selector:
        select:
          options:
            - male
            - female
            - other
          translation_key: animal_sex
          mode: dropdown
    birth_date:
      selector:
        date:
    arrival_date:
      selector:
        date:

update_animal:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health
    name:
      selector:
        text:
    species:
      selector:
        text:
    breed:
      selector:
        text:
    color:
      selector:
        text:
    sex:
      selector:
        select:
          options:
            - male
            - female
            - other
          translation_key: animal_sex
          mode: dropdown
    birth_date:
      selector:
        date:
    arrival_date:
      selector:
        date:

set_animal_status:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health
    status:
      required: true
      selector:
        select:
          options:
            - active
            - missing
            - sold
            - rehomed
            - deceased
            - other_departure
          translation_key: animal_status
          mode: dropdown

archive_animal:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health

restore_animal:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health

create_event:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health
    event_type:
      required: true
      selector:
        select:
          options:
            - observation
            - symptom
            - weight
            - diagnosis
            - treatment
            - medication
            - vaccination
            - veterinary_visit
            - care
            - other
          translation_key: event_type
          mode: dropdown
    occurred_at:
      selector:
        datetime:
    title:
      required: true
      selector:
        text:
    notes:
      selector:
        text:
          multiline: true
    value:
      selector:
        number:
          mode: box
    unit:
      selector:
        text:
    correction_of_event_id:
      selector:
        text:

list_events:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 200
          step: 1
          mode: box
