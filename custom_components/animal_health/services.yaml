      selector:
        datetime: {}
    medication_name:
      required: true
      selector:
        select:
          options:
            - Flubenol 5% ad us. vet.
            - Flubenol KH ad us. vet.
            - Baycox 2.5% ad us. vet.
            - Baycox 5% ad us. vet.
            - Metacam 1.5 mg/ml orale Suspension für Hunde
            - Metacam 0.5 mg/ml orale Suspension für Katzen
            - Metacam 5 mg/ml Injektionslösung für Hunde und Katzen
            - Panacur PetPaste ad us. vet.
            - Panacur Tabletten ad us. vet.
            - Panacur Suspension ad us. vet.
            - Milbemax Kautabletten für Hunde ad us. vet.
            - Milbemax Tabletten für Katzen ad us. vet.
            - Bravecto Plus Spot-on für Katzen ad us. vet.
            - Apoquel ad us. vet.
            - Easotic ad us. vet.
            - Optimmune Augensalbe ad us. vet.
            - Milteforan ad us. vet.
            - Clevor 30 mg/ml Augentropfen ad us. vet.
            - Bonqat 50 mg/ml ad us. vet.
            - Zycortal 25 mg/ml ad us. vet.
            - Numelvi ad us. vet.
            - Tessie 0.3 mg/ml ad us. vet.
            - Zenrelia ad us. vet.
            - Inflacam 15 mg/ml orale Suspension für Pferde
            - Eprecis 20 mg/ml ad us. vet.
            - Butox Protect ad us. vet.
            - Regumate Equine ad us. vet.
          custom_value: true
          mode: dropdown
          sort: true
    dose:
      required: true
      selector:
        number:
          min: 0.001
          step: any
          mode: box
    dose_unit:
      required: true
      selector:
        select:
          options: [mcg, mg, g, ul, ml, drop, tablet, dose]
          translation_key: dose_unit
          mode: dropdown
    route:
      selector:
        select:
          options: [oral, topical, subcutaneous, intramuscular, intravenous, eye, ear, spray, other]
          translation_key: administration_route
          mode: dropdown
    notes:
      selector:
        text:
          multiline: true
    correction_of_event_id:
      selector:
        text: {}
