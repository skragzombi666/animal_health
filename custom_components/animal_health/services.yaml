create_event:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health
    event_type:
      required: true
      selector:
        select:
          options: [observation, diagnosis, treatment, veterinary_visit, care, other]
          translation_key: event_type
          mode: dropdown
    occurred_at:
      selector:
        datetime: {}
    title:
      required: true
      selector:
        text: {}
    notes:
      selector:
        text:
          multiline: true
    correction_of_event_id:
      selector:
        text: {}
record_weight:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health
    occurred_at:
      selector:
        datetime: {}
    weight:
      required: true
      selector:
        number:
          min: 0.001
          step: any
          mode: box
    weight_unit:
      required: true
      default: kg
      selector:
        select:
          options: [mg, g, kg]
          translation_key: weight_unit
          mode: dropdown
    notes:
      selector:
        text:
          multiline: true
    correction_of_event_id:
      selector:
        text: {}
record_symptom:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health
    occurred_at:
      selector:
        datetime: {}
    symptom:
      required: true
      selector:
        select:
          options: [reduced_appetite, lethargy, diarrhea, coughing, sneezing, lameness, weight_loss]
          custom_value: true
          translation_key: symptom
          mode: dropdown
          sort: true
    severity:
      required: true
      default: moderate
      selector:
        select:
          options: [mild, moderate, severe, critical]
          translation_key: symptom_severity
          mode: dropdown
    notes:
      selector:
        text:
          multiline: true
    correction_of_event_id:
      selector:
        text: {}
record_medication:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: animal_health
